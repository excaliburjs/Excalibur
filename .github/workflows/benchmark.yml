name: Benchmark

# Informational performance comparison of this build against the latest published release, run with
# https://github.com/excaliburjs/excalibur-benchmark. Results land in the job summary and in the
# `benchmark-results` artifact (results json, svg charts, report.md, meta.json). The job never fails on a
# regression: shared runners are noisy, look for changes that persist across runs.
#
# This workflow executes the code under test, so it is deliberately unprivileged: read-only token, no persisted
# credentials, and it never comments. `benchmark-comment.yml` handles `/benchmark` PR comments (it dispatches this
# workflow with the PR head sha) and posts the sticky PR comment from the artifact once a run completes.
#
# Hosted runners have no GPU: Chromium renders with swiftshader, so drawing scenarios (bunnymark) are ~40x slower than
# on real hardware. Deltas between the two engines still compare like for like. For real GPU numbers run the tool
# locally with `--gl hardware --headed`, or point this workflow at a self-hosted runner with a GPU and xvfb.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline engine spec (npm:excalibur@<version|tag>, or a URL to a UMD bundle)'
        default: 'npm:excalibur@latest'
        required: false
      tests:
        description: 'Comma separated scenario names to run (empty = all)'
        default: ''
        required: false
      repeat:
        description: 'Interleaved repetitions per scenario'
        default: '3'
        required: false
      ref:
        description: 'Commit to benchmark (empty = the ref the workflow runs on). Set by /benchmark comments.'
        default: ''
        required: false
      pr:
        description: 'Pull request number to report results on (empty = none). Set by /benchmark comments.'
        default: ''
        required: false
      trigger:
        description: 'Who/what started the run, shown in the PR comment. Set by /benchmark comments.'
        default: ''
        required: false

concurrency:
  group: benchmark-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

env:
  # Pin the benchmark tool to a known commit. Update deliberately when the tool or its scenarios change.
  BENCHMARK_REPO: excaliburjs/excalibur-benchmark
  BENCHMARK_REF: main # TODO replace with the sha of the pushed benchmark tool rewrite
  BENCHMARK_BASELINE: ${{ inputs.baseline || 'npm:excalibur@latest' }}
  BENCHMARK_REPEAT: ${{ inputs.repeat || '2' }}
  BENCHMARK_TESTS: ${{ inputs.tests || '' }}
  BENCHMARK_WARN_PERCENT: '20'
  # what the results are about, written to meta.json for the comment workflow
  BENCHMARK_PR: ${{ github.event.pull_request.number || inputs.pr || '' }}
  BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
  BENCHMARK_TRIGGER: ${{ inputs.trigger || '' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # untrusted code runs here: read-only token, nothing else
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # empty for pull_request/push (default checkout), the PR head sha for dispatched /benchmark runs
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - name: Build candidate bundle
        run: npm run build:production

      - name: Checkout benchmark tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark
          token: ${{ secrets.BENCHMARK_READ }}
          # never leave the token on disk where the code under test could read it
          persist-credentials: false
      - name: Install benchmark tool
        working-directory: benchmark
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run build

      - name: Run benchmarks
        working-directory: benchmark
        run: |
          node bench.mjs run \
            --candidate ../build/dist/excalibur.js \
            --baseline "$BENCHMARK_BASELINE" \
            --repeat "$BENCHMARK_REPEAT" \
            ${BENCHMARK_TESTS:+--tests "$BENCHMARK_TESTS"} \
            --out ../bench-results/results.json \
            --charts ../bench-results/charts

      - name: Report
        if: always()
        working-directory: benchmark
        run: |
          mkdir -p ../bench-results
          if [ -f ../bench-results/results.json ]; then
            node bench.mjs report ../bench-results/results.json --markdown --warn "$BENCHMARK_WARN_PERCENT" --charts ../bench-results/charts > ../bench-results/report.md
            cat ../bench-results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark produced no results" >> "$GITHUB_STEP_SUMMARY"
          fi
          # consumed by benchmark-comment.yml, values come from event data / validated dispatch inputs
          node -e '
            const fs = require("fs");
            fs.writeFileSync("../bench-results/meta.json", JSON.stringify({
              pr: process.env.BENCHMARK_PR, headSha: process.env.BENCHMARK_HEAD_SHA, trigger: process.env.BENCHMARK_TRIGGER
            }));
          '

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results/
          retention-days: 30
          if-no-files-found: ignore
