name: Benchmark Comment

# `/benchmark` PR comments (collaborators only) are validated and turned into a workflow_dispatch of benchmark.yml at
# the PR's head sha. Options: --baseline npm:excalibur@<version|tag> --tests a,b --repeat n
#
# This is the only privileged part of the benchmark and it never checks out or runs PR code: the script comes from
# the default branch, the raw comment text is validated against strict patterns, and the bot's reply is built from the
# validated values only. Results are never fed back here: they live in the job summary of the dispatched run, which
# the reply links to, so no write token ever handles output produced by the code under test.
# issue_comment workflows only run from the default branch, so this is active once the file is on main.

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the script from the default branch
      actions: write # dispatch benchmark.yml and look up the run it started
      pull-requests: read # head sha of the PR
      issues: write # reaction + reply on the PR comment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate command and dispatch benchmark
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/dispatch-benchmark.js');
            await script({ github, context, core });
